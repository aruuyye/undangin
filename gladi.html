<!DOCTYPE html>
<html lang="id" style="--monitor-scale-x: 1; --monitor-scale-y: 1; --monitor-scale: 1; --monitor-opacity: 1;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrival Monitor - Kedatangan Polije</title>
    <link rel="icon" type="image/png" href="https://undangin.polije.ac.id/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #030a1a; color: white; font-family: 'Plus Jakarta Sans', sans-serif; height: 100vh; width: 100vw; }
        #visual-monitor-wrapper { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #030a1a; position: fixed; top: 0; left: 0; z-index: 1; }
        #visual-monitor-backdrop { position: absolute; inset: -30px; background: radial-gradient(circle at center, #0f2b5c 0%, #030a1a 100%); z-index: 0; }
        
        #visual-monitor-canvas { 
            z-index: 1; width: 1440px; height: 960px; 
            background: radial-gradient(circle at center, #112d69 0%, #06132e 100%);
            border: 4px solid #38bdf8; 
            box-shadow: inset 0 0 0 8px #06132e, inset 0 0 0 10px #2563eb, 0 0 50px rgba(14, 165, 233, 0.3);
            position: relative; flex-shrink: 0; transform-origin: center; 
            transform: scale(var(--monitor-scale-x, var(--monitor-scale, 0.1)), var(--monitor-scale-y, var(--monitor-scale, 0.1))); 
            opacity: var(--monitor-opacity, 0); transition: opacity 0.3s ease; 
            display: flex; flex-direction: column; align-items: center; padding: 35px 50px; box-sizing: border-box;
            overflow: hidden;
        }

        .header-section { text-align: center; width: 100%; margin-bottom: 20px; flex-shrink: 0; }
        .header-section img { height: 90px; max-width: 350px; object-fit: contain; margin-bottom: 10px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
        .header-section h1 { font-family: 'Playfair Display', serif; color: #38bdf8; font-size: 50px; margin: 0; font-weight: 700; letter-spacing: 2px; text-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }
        .divider-gold { width: 400px; height: 2px; background: linear-gradient(90deg, transparent, #38bdf8, transparent); margin: 10px auto; }
        .header-section h2 { font-family: 'Playfair Display', serif; font-size: 22px; color: #e0f2fe; font-weight: 400; margin: 0; font-style: italic; }

        .guest-list-container { width: 85%; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; justify-content: center; }
        
        .guest-item { 
            display: flex; align-items: center; justify-content: space-between; 
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(56, 189, 248, 0.2); 
            border-left: 6px solid #1d4ed8; padding: 10px 24px; border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); height: 50px; box-sizing: border-box;
            animation: slideInFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.3s ease;
        }

        .guest-item.latest { 
            background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.8); 
            border-left: 8px solid #38bdf8; transform: scale(1.01); box-shadow: 0 6px 25px rgba(56, 189, 248, 0.25);
        }

        .guest-name { font-size: 22px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 75%; }
        .guest-item.latest .guest-name { color: #38bdf8; font-size: 26px; font-family: 'Playfair Display', serif; letter-spacing: 1px; }
        .guest-time { font-size: 16px; font-weight: 600; color: #cbd5e1; font-family: monospace; }
        .guest-item.latest .guest-time { color: #38bdf8; }
        .empty-state { text-align: center; font-size: 22px; color: #cbd5e1; margin-top: 20px; font-weight: 400; font-family: 'Playfair Display', serif; font-style: italic; }

        @keyframes slideInFade {
            0% { opacity: 0; transform: translateY(-20px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

    <div id="visual-monitor-wrapper">
        <div id="visual-monitor-backdrop"></div>
        <div id="visual-monitor-canvas" data-width="1440" data-height="960">
            <div class="header-section">
                <img src="https://kui.polije.ac.id/files/profile/Profile-Kantor%20Internasional%20Politeknik%20Negeri%20Jember.webp" alt="Logo Polije">
                <h1 id="monitor-title">Kedatangan Gladi Wisudawan</h1>
                <div class="divider-gold"></div>
                <h2>Wisuda Ke-50 Politeknik Negeri Jember</h2>
            </div>
            <div id="guest-list" class="guest-list-container">
                <div class="empty-state">Loading sistem monitor...</div>
            </div>
        </div>
    </div>

    <!-- STAFF / JURUSAN BADGE -->
    <div style="position: fixed; top: 1.5rem; right: 1.5rem; z-index: 99998; background: rgba(3, 10, 26, 0.8); border: 1px solid #38bdf8; color: #38bdf8; padding: 0.6rem 1.25rem; border-radius: 99px; font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; backdrop-filter: blur(5px);">
        <span style="width: 10px; height: 10px; background: #38bdf8; border-radius: 50%;"></span>
        <span id="staff-badge">FILTER: ALL</span>
    </div>

    <!-- CONNECTION STATUS INDICATOR -->
    <div id="connection-status" style="position: fixed; bottom: 0.5rem; left: 1rem; z-index: 99998; color: #cbd5e1; font-size: 0.75rem; font-weight: 400; opacity: 0.6;">
        Status: Menyiapkan koneksi...
    </div>

    <!-- FLOATING CONTROLS FOR TV BROWSER -->
    <div id="fullscreen-control" style="position: fixed; bottom: 2rem; right: 2rem; z-index: 99999; opacity: 0.3; transition: 0.3s; display: flex; gap: 0.75rem; align-items: center;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.3'">
        <button onclick="toggleFitMode()" title="Ubah Ukuran Fit Layar" style="background: rgba(15, 23, 42, 0.85); border: 1px solid #38bdf8; color: #38bdf8; width: 60px; height: 60px; border-radius: 50%; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(8px); box-shadow: 0 10px 25px rgba(0,0,0,0.5); outline: none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-bottom: 2px;">
                <path d="M4 14h6v6M20 10h-6V4"></path>
            </svg>
            <span id="fit-mode-label" style="font-size: 0.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em;">FIT</span>
        </button>
        <button onclick="toggleFullScreen()" title="Fullscreen" style="background: rgba(15, 23, 42, 0.85); border: 1px solid #38bdf8; color: #38bdf8; width: 60px; height: 60px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); box-shadow: 0 10px 25px rgba(0,0,0,0.5); outline: none;">
            <svg id="fs-icon-open" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg>
            <svg id="fs-icon-close" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display: none;"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"></path></svg>
        </button>
    </div>

    <script>
        // Mengambil URL API dari pengaturan localStorage (jika pernah diset di dashboard) atau gunakan default
        let savedConfig = {};
        try {
            savedConfig = JSON.parse(localStorage.getItem('gh_monitor_config') || '{}');
        } catch (e) {}

        const API_DIRECT = savedConfig.apiUrl || 'https://undangin.polije.ac.id/api/v1/event/12/guests';
        let useCorsProxy = Boolean(savedConfig.useCorsProxy);

        const urlParams = new URLSearchParams(window.location.search);
        const targetStaff = urlParams.has('staff') ? urlParams.get('staff').toLowerCase().trim() : '';
        const targetJurusan = urlParams.has('jurusan') ? urlParams.get('jurusan').toLowerCase().trim() : '';
        // Mode: 'gladi' (arrival === true) atau 'kedatangan' (souvenir === true)
        const targetMode = urlParams.get('mode') === 'kedatangan' ? 'souvenir' : 'arrival';

        if (targetMode === 'souvenir') {
            document.getElementById('monitor-title').innerText = 'Kedatangan Wisudawan';
        }

        if (targetJurusan) {
            document.getElementById('staff-badge').innerText = `JURUSAN: ${targetJurusan.toUpperCase()}`;
        } else if (targetStaff) {
            document.getElementById('staff-badge').innerText = `STAFF: ${targetStaff.toUpperCase()}`;
        }

        let lastDataHash = "";
        let pollingTimer = null;

        // Sama persis dengan getFieldValue di kode Vue Anda yang lancar
        function getFieldValue(guest, fieldKey) {
            if (guest[fieldKey] !== undefined && guest[fieldKey] !== null) {
                return guest[fieldKey];
            }
            let innerData = guest.data;
            if (typeof innerData === 'string') {
                try { innerData = JSON.parse(innerData); } catch (e) { innerData = {}; }
            }
            if (innerData && innerData[fieldKey] !== undefined && innerData[fieldKey] !== null) {
                return innerData[fieldKey];
            }
            return '-';
        }

        // Sama persis dengan getFormattedTime di kode Vue Anda yang lancar
        function getFormattedTime(guest) {
            if (guest.updated_at) {
                return guest.updated_at.split(' ')[1] || guest.updated_at;
            }
            return '--:--';
        }

        async function fetchKedatanganList() {
            if (pollingTimer) clearTimeout(pollingTimer);

            const statusEl = document.getElementById('connection-status');
            const listContainer = document.getElementById('guest-list');

            let data = null;
            let errorMessage = "";

            // 1. Coba fetch langsung persis seperti kode Vue Anda
            let requestUrl = API_DIRECT;
            if (useCorsProxy) {
                requestUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(API_DIRECT);
            }

            try {
                const res = await fetch(requestUrl);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                data = await res.json();
            } catch (err) {
                errorMessage = err.message;
                // 2. Auto-Fallback: Jika gagal karena CORS, otomatis coba lewat CORS Proxy
                if (!useCorsProxy) {
                    try {
                        const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(API_DIRECT);
                        const proxyRes = await fetch(proxyUrl);
                        if (proxyRes.ok) {
                            data = await proxyRes.json();
                            useCorsProxy = true; // Gunakan proxy untuk request berikutnya
                        }
                    } catch (proxyErr) {
                        errorMessage = proxyErr.message;
                    }
                }
            }

            if (!data || !data.guests) {
                statusEl.innerText = `Status: Gagal Terhubung (${errorMessage})`;
                if (lastDataHash === "") {
                    listContainer.innerHTML = `<div class="empty-state" style="color:#ef4444;">Gagal mengambil data dari API.<br><small>${errorMessage}</small></div>`;
                }
                pollingTimer = setTimeout(fetchKedatanganList, 2000);
                return;
            }

            const guests = data.guests;

            // Filter tamu yang sudah scan menggunakan logika yang SAMA PERSIS dengan kode Vue Anda:
            // g.arrival === true (untuk Gladi) atau g.souvenir === true (untuk Kedatangan)
            let filteredGuests = guests.filter(g => {
                // Cek apakah sudah scan (Gladi / Kedatangan)
                const isScanned = (g[targetMode] === true) || (targetMode === 'arrival' && g.souvenir === true && !urlParams.has('mode'));
                // Catatan: Prioritaskan g.arrival === true sesuai tabel Gladi di kode kedua Anda
                const hasArrivalScan = g[targetMode] === true;

                if (!hasArrivalScan) return false;

                // Filter Jurusan jika ada ?jurusan=... di URL
                if (targetJurusan !== "") {
                    const j = String(getFieldValue(g, 'Jurusan')).toLowerCase();
                    if (j !== targetJurusan) return false;
                }

                // Filter Staff jika ada ?staff=... di URL
                if (targetStaff !== "") {
                    const scannedById = getFieldValue(g, 'scanned_by');
                    const mappedStaffName = scannedById !== '-' ? `staff${scannedById}`.toLowerCase() : "";
                    if (mappedStaffName !== targetStaff && String(scannedById).toLowerCase() !== targetStaff) {
                        return false;
                    }
                }

                return true;
            });

            // Urutkan berdasarkan updated_at terbaru (persis seperti kode kedua Anda)
            filteredGuests.sort((a, b) => {
                const dateA = new Date(a.updated_at || 0).getTime();
                const dateB = new Date(b.updated_at || 0).getTime();
                return dateB - dateA;
            });

            statusEl.innerText = `Status: LIVE (${new Date().toLocaleTimeString('id-ID')}) | Total Hadir: ${filteredGuests.length} / ${guests.length}`;

            const top8Guests = filteredGuests.slice(0, 8);
            const currentHash = JSON.stringify(top8Guests.map(g => `${g.id}_${g.updated_at}_${g.arrival}_${g.souvenir}`));
            
            if (currentHash !== lastDataHash) {
                lastDataHash = currentHash;
                renderList(top8Guests);
            }

            // Polling ulang setiap 2 detik setelah request selesai (sama seperti pola setTimeout di kode Vue Anda)
            pollingTimer = setTimeout(fetchKedatanganList, 2000);
        }

        function renderList(guests) {
            const listContainer = document.getElementById('guest-list');
            
            if (guests.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        Belum ada kedatangan yang dipindai<br>
                        <span style="font-size:16px; font-family:'Plus Jakarta Sans', sans-serif;">
                            (Filter: ${targetJurusan ? targetJurusan.toUpperCase() : (targetStaff ? targetStaff.toUpperCase() : 'SEMUA PESERTA')})
                        </span>
                    </div>`;
                return;
            }

            let htmlContent = '';
            guests.forEach((guest, index) => {
                const isLatest = index === 0;
                
                // Ambil Nama, Prodi/Jurusan menggunakan getFieldValue seperti di kode Vue
                const guestName = getFieldValue(guest, 'Nama') !== '-' ? getFieldValue(guest, 'Nama') : (guest.name || 'Tanpa Nama');
                const timeFormatted = getFormattedTime(guest);

                htmlContent += `
                    <div class="guest-item ${isLatest ? 'latest' : ''}">
                        <div class="guest-name">${guestName}</div>
                        <div class="guest-time">${timeFormatted}</div>
                    </div>
                `;
            });

            listContainer.innerHTML = htmlContent;
        }

        function toggleFitMode() {
            const current = localStorage.getItem('monitor_fit_mode') || 'contain';
            let next = 'contain';
            if (current === 'contain') { next = 'stretch'; } 
            else if (current === 'stretch') { next = 'cover'; }
            localStorage.setItem('monitor_fit_mode', next);
            updateFitModeLabel();
            autoFit();
        }

        function updateFitModeLabel() {
            const mode = localStorage.getItem('monitor_fit_mode') || 'contain';
            const el = document.getElementById('fit-mode-label');
            if (el) { el.innerText = mode === 'contain' ? 'FIT' : (mode === 'stretch' ? 'FILL' : 'COVER'); }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    document.getElementById('fs-icon-open').style.display = 'none';
                    document.getElementById('fs-icon-close').style.display = 'block';
                }).catch(err => { alert(`Gagal Fullscreen: ${err.message}`); });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    document.getElementById('fs-icon-open').style.display = 'block';
                    document.getElementById('fs-icon-close').style.display = 'none';
                }
            }
        }

        function autoFit() {
            const canvas = document.getElementById('visual-monitor-canvas');
            if (!canvas) return;
            
            const monW = 1440;
            const monH = 960;
            const fitMode = localStorage.getItem('monitor_fit_mode') || 'contain';
            
            let scaleX, scaleY;
            if (fitMode === 'stretch') {
                scaleX = window.innerWidth / monW;
                scaleY = window.innerHeight / monH;
            } else if (fitMode === 'cover') {
                const scale = Math.max(window.innerWidth / monW, window.innerHeight / monH);
                scaleX = scale; scaleY = scale;
            } else {
                const scale = Math.min((window.innerWidth * 0.98) / monW, (window.innerHeight * 0.98) / monH);
                scaleX = scale; scaleY = scale;
            }
            
            document.documentElement.style.setProperty('--monitor-scale-x', scaleX);
            document.documentElement.style.setProperty('--monitor-scale-y', scaleY);
            document.documentElement.style.setProperty('--monitor-scale', scaleX);
            document.documentElement.style.setProperty('--monitor-opacity', '1');
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateFitModeLabel();
            autoFit();
            fetchKedatanganList();
        });

        window.addEventListener('resize', autoFit);

        let timeout;
        document.addEventListener('mousemove', () => {
            const el = document.getElementById('fullscreen-control');
            if (el) {
                el.style.opacity = '1';
                clearTimeout(timeout);
                timeout = setTimeout(() => { el.style.opacity = '0.3'; }, 5000);
            }
        });
    </script>
</body>
</html>
